<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --primary: #002D57; --accent: #00A8E8; --bg: #F4F7FE; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); padding-bottom: 90px; color: #1A202C; overflow-x: hidden; }
    .header-box { background: var(--primary); color: white; padding: 18px 20px; border-radius: 0 0 25px 25px; }
    .card-mewah { background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    .hero-stat { background: linear-gradient(135deg, #002D57 0%, #00509D 100%); color: white; padding: 15px !important; border-radius: 25px; }
    .gauge-container { width: 90px; margin: 0 auto; position: relative; }
    .gauge-label { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    
    /* GAGAH FONT SIZE: LOCK 22PX */
    .jab-pct { background: var(--primary); color: white; border-radius: 12px; font-size: 22px !important; font-weight: 800; padding: 6px 0; display: block; margin-bottom: 10px; }
    .jab-detail { font-size: 10px; line-height: 1.4; text-align: left; border-top: 1px dashed #eee; padding-top: 8px; color: #64748B; }
    .cair-row { background: #f8fafc; padding: 12px 16px; border-radius: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); }
    
    /* PIPELINE COMPONENTS */
    .p-title { font-size: 8px; font-weight: 800; color: #94A3B8; text-transform: uppercase; }
    .p-val { font-size: 16px; font-weight: 800; color: var(--primary); display: block; }
    .funnel-step { background: #f1f5f9; padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; }

    .nav-fix { position: fixed; bottom: 12px; left: 12px; right: 12px; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-radius: 22px; box-shadow: 0 10px 35px rgba(0,0,0,0.12); z-index: 1000; }
    .nav-item { text-align: center; color: #94A3B8; text-decoration: none; font-size: 10px; flex: 1; font-weight: 700; cursor: pointer; }
    .nav-item.active { color: var(--primary); }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div id="loader"><div class="spinner-grow text-primary"></div><p class="mt-3 fw-bold">Sinkronisasi Command Center...</p></div>

  <div id="app">
    <div class="header-box d-flex justify-content-between align-items-center">
      <div><p class="small mb-0 opacity-75 fw-bold" style="font-size:9px;">COMMAND CENTER</p><h6 class="fw-bold mb-0" id="u-nama">YULIUS PL</h6></div>
      <button class="btn btn-sm btn-outline-light rounded-pill px-3" style="font-size:10px; font-weight:800;" onclick="location.reload()">REFRESH</button>
    </div>

    <div class="p-3">
      <div id="v-home">
        <div class="card-mewah mb-2">
          <div class="row g-1">
            <div class="col-6"><input type="date" id="f-start" class="form-control form-control-sm" onchange="runFilter()"></div>
            <div class="col-6"><input type="date" id="f-end" class="form-control form-control-sm" onchange="runFilter()"></div>
            <div class="col-6 mt-1"><select id="f-c" class="form-select form-select-sm" onchange="runFilter(true)"></select></div>
            <div class="col-6 mt-1"><select id="f-n" class="form-select form-select-sm" onchange="runFilter()"></select></div>
          </div>
        </div>
        <div class="card-mewah hero-stat text-center shadow mb-2">
          <div class="d-flex justify-content-center mb-1"><div class="gauge-container"><canvas id="gChart"></canvas><div class="gauge-label"><h3 class="fw-bold mb-0" id="g-p" style="font-size:16px;">0%</h3></div></div></div>
          <h2 class="fw-bold mb-1" id="g-r" style="font-size: 24px;">Rp 0</h2>
          <div class="mt-2 py-2" style="background: rgba(255,255,255,0.1); border-radius: 15px;">
            <p class="small mb-0 opacity-75" style="font-size:11px; font-weight: 600;">Target Bulan Ini :</p>
            <h4 class="fw-bold mb-0" id="g-t" style="font-size: 18px;">Rp 0</h4>
          </div>
        </div>
        <div class="row g-2 mb-3" id="ach-cards"></div>
        <div id="cair-list"></div>
      </div>

      <div id="v-pipe" style="display:none">
        <div class="card-mewah mb-2">
          <div class="row g-1">
            <div class="col-6"><input type="date" id="p-start" class="form-control form-control-sm" onchange="filterPipe()"></div>
            <div class="col-6"><input type="date" id="p-end" class="form-control form-control-sm" onchange="filterPipe()"></div>
            <div class="col-4 mt-1"><select id="p-c" class="form-select form-select-sm" onchange="filterPipe()"></select></div>
            <div class="col-4 mt-1"><select id="p-s" class="form-select form-select-sm" onchange="filterPipe()"></select></div>
            <div class="col-4 mt-1"><select id="p-spv" class="form-select form-select-sm" onchange="filterPipe()"></select></div>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-4"><div class="card-mewah p-2 text-center"><span class="p-title">Aplikasi</span><b class="p-val" id="kp-apk">0</b></div></div>
          <div class="col-4"><div class="card-mewah p-2 text-center"><span class="p-title">Approve</span><b class="p-val text-success" id="kp-app">0</b></div></div>
          <div class="col-4"><div class="card-mewah p-2 text-center"><span class="p-title">Reject</span><b class="p-val text-danger" id="kp-rej">0</b></div></div>
          <div class="col-4"><div class="card-mewah p-2 text-center"><span class="p-title">Blm Cair</span><b class="p-val text-warning" id="kp-bc">0</b></div></div>
          <div class="col-8"><div class="card-mewah p-2 text-center"><span class="p-title">Total Plafond</span><b class="p-val" id="kp-pla">Rp 0</b></div></div>
        </div>
        <div class="card-mewah p-2 mb-2 text-center"><span class="p-title">Conversion Rate</span><h4 class="fw-bold mb-0 text-primary" id="kp-cv">0%</h4></div>
        <div class="card-mewah mb-2">
          <h6 class="p-title mb-3">Funnel Pipeline</h6>
          <div class="funnel-step"><span>APK NAIK</span><b id="fn-naik">0</b></div>
          <div class="funnel-step" style="border-left-color: #10B981"><span>APPROVE</span><b id="fn-app">0</b></div>
          <div class="funnel-step" style="border-left-color: #00A8E8"><span>CAIR</span><b id="fn-cair">0</b></div>
        </div>
        <div class="row g-2 mb-2"><div class="col-6"><div class="card-mewah p-2"><canvas id="piePipe"></canvas></div></div><div class="col-6"><div class="card-mewah p-2"><canvas id="trendPipe"></canvas></div></div></div>
        <div class="row g-2 mb-2"><div class="col-6"><div class="card-mewah p-2"><h6 class="p-title">Cabang</h6><div id="perf-cab"></div></div></div><div class="col-6"><div class="card-mewah p-2"><h6 class="p-title">Sales</h6><div id="perf-sal"></div></div></div></div>
        <div class="card-mewah p-0 overflow-hidden"><div class="p-2 border-bottom bg-light d-flex justify-content-between"><span class="fw-bold small">Daftar Debitur</span><input type="text" id="p-search" class="form-control form-control-sm w-50" placeholder="Cari..." onkeyup="filterPipe()"></div><div style="max-height:200px; overflow-y:auto"><table class="table table-sm mb-0" style="font-size:10px;"><tbody id="pipe-body"></tbody></table></div></div>
      </div>

      <div id="v-admin" style="display:none">
        <div class="card-mewah shadow">
          <h6 class="fw-bold mb-4 text-primary">ADMIN PANEL</h6>
          <input type="date" id="u-t" class="form-control mb-3">
          <select id="u-j" class="form-select mb-3"><option value="7">Pipeline Data</option><option value="1">Achv CS</option><option value="2">Achv SPV</option><option value="4">Cair CS</option><option value="5">Cair SPV</option></select>
          <input type="file" id="u-f" class="form-control mb-4"><button class="btn btn-primary w-100 fw-bold py-3 shadow" onclick="execU()">UNGGAH DATA</button>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-fix">
    <a onclick="switchPage('home')" class="nav-item active" id="n-h"><i class="bi bi-speedometer2" style="font-size:20px; display:block;"></i>Home</a>
    <a onclick="switchPage('pipe')" class="nav-item" id="n-p"><i class="bi bi-funnel-fill" style="font-size:20px; display:block;"></i>Pipeline</a>
    <a onclick="switchPage('admin')" class="nav-item" id="n-a"><i class="bi bi-shield-lock-fill" style="font-size:20px; display:block;"></i>Admin</a>
  </div>

  <script>
    let db = { achv:[], cair:[], pipeline:[] }, charts = { gauge:null, pie:null, trend:null }, startX = 0;

    window.onload = function() { initData(); initSwipe(); };

    function initSwipe() {
      document.addEventListener('touchstart', e => startX = e.touches[0].clientX);
      document.addEventListener('touchend', e => {
        let diff = startX - e.changedTouches[0].clientX;
        if(Math.abs(diff) > 100) {
          if(diff > 0) { // Swipe Left
            if(document.getElementById('v-home').style.display !== 'none') switchPage('pipe');
            else if(document.getElementById('v-pipe').style.display !== 'none') switchPage('admin');
          } else { // Swipe Right
            if(document.getElementById('v-admin').style.display !== 'none') switchPage('pipe');
            else if(document.getElementById('v-pipe').style.display !== 'none') switchPage('home');
          }
        }
      });
    }

    function initData() {
      google.script.run.withSuccessHandler(res => {
        db = res; document.getElementById('u-nama').innerText = res.u.nama;
        const fill = (id, list, txt) => {
          const s = document.getElementById(id); s.innerHTML = `<option value="">${txt}</option>`;
          [...new Set(list)].filter(Boolean).sort().forEach(v => s.add(new Option(v, v)));
        };
        fill('f-c', res.listC, "Semua Cabang"); fill('p-c', res.listC, "Semua Cabang");
        fill('p-s', res.listS, "Semua Sales"); fill('p-spv', res.listSPV, "Semua SPV");
        runFilter(true); filterPipe();
        document.getElementById('loader').style.display = 'none';
      }).getDashboardData();
    }

    function switchPage(p) {
      ['v-home','v-pipe','v-admin'].forEach(v => document.getElementById(v).style.display = 'none');
      ['n-h','n-p','n-a'].forEach(n => document.getElementById(n).classList.remove('active'));
      document.getElementById('v-'+p).style.display = 'block';
      document.getElementById('n-'+p.charAt(0)).classList.add('active');
    }

    function runFilter(resetStaff = false) {
      const s = document.getElementById('f-start').value || "1900-01-01", e = document.getElementById('f-end').value || "2100-12-31";
      const c = document.getElementById('f-c').value, n = document.getElementById('f-n').value;
      const fAch = db.achv.filter(r => r[0] >= s && r[0] <= e && (c==="" || r[1]===c) && (n==="" || r[2]===n));
      if (resetStaff) {
        const sn = document.getElementById('f-n'); sn.innerHTML = '<option value="">Semua Staff</option>';
        [...new Set(fAch.map(r => r[2]))].filter(x => x && x !== "TELEMARKETING").sort().forEach(x => sn.add(new Option(x, x)));
      }
      let resA = { global:{r:0,t:0}, cs:{r:0,t:0}, spv:{r:0,t:0}, tele:{r:0,t:0} };
      fAch.forEach(r => { resA.global.r += r[5]; resA.global.t += r[4]; if(resA[r[3]]) { resA[r[3]].r += r[5]; resA[r[3]].t += r[4]; } });
      const fCair = db.cair.filter(r => r[0] >= s && r[0] <= e && (c==="" || r[1]===c) && (n==="" || r[2]===n));
      let resC = {}; fCair.forEach(r => { if(!resC[r[3]]) resC[r[3]] = { q: 0, v: 0 }; resC[r[3]].q += r[4]; resC[r[3]].v += r[5]; });

      document.getElementById('g-r').innerText = "Rp " + resA.global.r.toLocaleString('id-ID');
      document.getElementById('g-t').innerText = "Rp " + resA.global.t.toLocaleString('id-ID');
      let pG = resA.global.t > 0 ? (resA.global.r / resA.global.t * 100).toFixed(1) : 0;
      document.getElementById('g-p').innerText = pG + "%";

      let cardHtml = "";
      ['cs','spv','tele'].forEach(k => {
        let p = resA[k].t > 0 ? (resA[k].r / resA[k].t * 100).toFixed(1) : 0;
        let color = k==='cs'?'#002D57':(k==='spv'?'#10B981':'#F59E0B');
        cardHtml += `<div class="col-4"><div class="card-mewah p-2 text-center"><small class="fw-bold text-muted">${k.toUpperCase()}</small><span class="jab-pct" style="background:${color}">${p}%</span><div class="jab-detail">Tgt:<br><b>Rp ${resA[k].t.toLocaleString('id-ID')}</b><br>Ach:<br><b>Rp ${resA[k].r.toLocaleString('id-ID')}</b></div></div></div>`;
      });
      document.getElementById('ach-cards').innerHTML = cardHtml;
      let h = "";
      Object.keys(resC).sort().forEach(p => {
        h += `<div class="cair-row"><div><b style="font-size:12px;">${p}</b><br><small class="text-muted">${resC[p].q.toLocaleString('id-ID')} Item</small></div><div class="text-end"><span class="text-primary fw-bold">Rp ${resC[p].v.toLocaleString('id-ID')}</span></div></div>`;
      });
      document.getElementById('cair-list').innerHTML = h || "<p class='text-center py-2 small text-muted'>Data Kosong</p>";
      
      const ctx = document.getElementById('gChart').getContext('2d');
      if(charts.gauge) charts.gauge.destroy();
      charts.gauge = new Chart(ctx, { type: 'doughnut', data: { datasets: [{ data: [pG, 100-pG], backgroundColor: ['#00A8E8', 'rgba(0,0,0,0.05)'], borderWidth: 0, cutout: '80%', circumference: 240, rotation: 240 }] }, options: { plugins: { tooltip: {enabled: false} } } });
    }

    function filterPipe() {
      const start = document.getElementById('p-start').value || "1900-01-01", end = document.getElementById('p-end').value || "2100-12-31";
      const cab = document.getElementById('p-c').value, sal = document.getElementById('p-s').value, spv = document.getElementById('p-spv').value, key = document.getElementById('p-search').value.toLowerCase();
      const f = db.pipeline.filter(r => r.tgl >= start && r.tgl <= end && (cab==="" || r.cab===cab) && (sal==="" || r.sal===sal) && (spv==="" || r.spv===spv) && (key==="" || r.deb.toLowerCase().includes(key)));
      let k = { apk: f.length, app: 0, rej: 0, bc: 0, pla: 0, cair: 0 }, st = {}, trend = {}, pCab = {}, pSal = {};
      f.forEach(r => {
        k.pla += r.pla; st[r.st] = (st[r.st] || 0) + 1;
        if(!trend[r.tgl]) trend[r.tgl] = { apk:0 }; trend[r.tgl].apk++;
        if(r.kep === "APPROVE") k.app++; if(r.kep === "REJECT") k.rej++;
        if(r.st === "APP BLM CAIR") k.bc++; if(r.st === "CAIR") k.cair++;
        pCab[r.cab] = (pCab[r.cab] || 0) + 1; pSal[r.sal] = (pSal[r.sal] || 0) + 1;
      });
      document.getElementById('kp-apk').innerText = k.apk; document.getElementById('kp-app').innerText = k.app; document.getElementById('kp-rej').innerText = k.rej;
      document.getElementById('kp-bc').innerText = k.bc; document.getElementById('kp-pla').innerText = "Rp " + k.pla.toLocaleString('id-ID');
      document.getElementById('kp-cv').innerText = k.apk > 0 ? (k.app/k.apk*100).toFixed(1) + "%" : "0%";
      document.getElementById('fn-naik').innerText = k.apk; document.getElementById('fn-app').innerText = k.app; document.getElementById('fn-cair').innerText = k.cair;
      const rank = (id, obj) => { let h = ""; Object.keys(obj).sort((a,b)=>obj[b]-obj[a]).slice(0,5).forEach(x => { h += `<div class="perf-item"><span>${x}</span><b>${obj[x]}</b></div>`; }); document.getElementById(id).innerHTML = h || "Kosong"; };
      rank('perf-cab', pCab); rank('perf-sal', pSal);
      let tb = ""; f.slice(0,50).forEach(r => { tb += `<tr><td><b>${r.deb}</b><br><small>${r.sal}</small></td><td class="text-end">Rp ${r.pla.toLocaleString('id-ID')}</td><td class="text-center">${r.st}</td></tr>`; });
      document.getElementById('pipe-body').innerHTML = tb || "<tr><td colspan='3' class='text-center py-4'>Data Kosong</td></tr>";
      const ctxP = document.getElementById('piePipe').getContext('2d');
      if(charts.pie) charts.pie.destroy();
      charts.pie = new Chart(ctxP, { type:'pie', data:{ labels:Object.keys(st), datasets:[{data:Object.values(st), backgroundColor:['#002D57','#10B981','#F59E0B','#EF4444','#64748B']}] }, options:{ plugins:{legend:{display:false}} } });
      const ctxT = document.getElementById('trendPipe').getContext('2d');
      if(charts.trend) charts.trend.destroy();
      let dts = Object.keys(trend).sort();
      charts.trend = new Chart(ctxT, { type:'line', data:{ labels:dts, datasets:[{data:dts.map(d=>trend[d].apk), borderColor:'#002D57', tension:0.4}] }, options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true},x:{display:false}} } });
    }

    function execU() {
      const f = document.getElementById('u-f').files[0], t = document.getElementById('u-t').value, j = document.getElementById('u-j').value;
      if(!f || !t) return alert("Lengkapi data!");
      Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      const r = new FileReader();
      r.onload = function(e) {
        const rows = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type: 'array'}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type: 'array'}).SheetNames[0]], {header: 1});
        google.script.run.withSuccessHandler(res => { Swal.fire('Berhasil', res, 'success').then(() => location.reload()); }).processExcelData(rows, t, j);
      };
      r.readAsArrayBuffer(f);
    }
  </script>
</body>
</html>
